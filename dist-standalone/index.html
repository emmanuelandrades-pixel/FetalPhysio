1. Línea base estable entre 110-160 lpm sin desaceleraciones.
2. Variabilidad normal (5-25 lpm).
3. Presencia de "Ciclado Fetal" (alternancia entre períodos de variabilidad reducida y aumentada).

La presencia de aceleraciones no es un requisito estricto en el parto si los demás criterios están presentes. El ciclado fetal es la característica conductual fundamental del feto a término neurológicamente normal y no hipóxico.`},{id:"slow",title:"Hipoxia de Evolución Lenta",content:`Es la respuesta fisiológica a episodios intermitentes de privación de oxígeno, comúnmente por compresión del cordón. El feto tiene tiempo para realizar ajustes metabólicos y cardiovasculares. La cascada evolutiva es:

1. Aparición de Desaceleraciones: Inicialmente el feto responde a las contracciones.
2. Aumento de la Línea Base: Taquicardia compensatoria para aumentar el gasto cardíaco (mediada por catecolaminas).
3. Pérdida de Variabilidad: A medida que el miocardio se fatiga y aparece la acidosis.
4. Bradicardia Terminal: Caída final de la FCF si no se alivia el estrés.

En ausencia de acidemia progresiva, el feto puede sostener esta adaptación casi indefinidamente.`},{id:"subacute",title:"Hipoxia Subaguda (Hiperestimulación)",content:`Se caracteriza por desaceleraciones variables prolongadas (caída >60 lpm por >90 s) con un tiempo de recuperación basal muy breve (<60 s). Ocurre frecuentemente durante taquisistolia uterina.

El breve tiempo en la línea base impide al feto eliminar la carga de CO2, llevando a una rápida acumulación y acidosis respiratoria seguida de acidosis metabólica. El pH puede caer a un ritmo aproximado de 0.01 cada 2-3 minutos (mucho más rápido que en la hipoxia de evolución lenta, donde la caída es de horas). Es una emergencia clínica que requiere suspender uterotónicos y administrar tocólisis inmediata.`},{id:"acute",title:"Hipoxia Aguda (Evento Centinela)",content:`Causada por un bloqueo repentino y profundo del intercambio gaseoso (ej. prolapso de cordón, rotura uterina, abrupcio masivo). 

El pO2 fetal cae bruscamente, provocando un vasoespasmo generalizado mediado por quimiorreflejos para centralizar el flujo sanguíneo. Resulta en una desaceleración profunda (bradicardia terminal <80 lpm) de aparición súbita que no se recupera en 3 minutos. La rápida caída de energía lleva a hipotensión sistémica e infarto cerebral, afectando áreas corticales y profundas.

Regla de los 3-6-9-12-15: ante una bradicardia mantenida sin causa reversible, el tiempo apremia. A los 3 min debe iniciarse la evaluación y reanimación intrauterina; a los 6 min, si no recupera, se decide la extracción; a los 9 min se moviliza a pabellón; a los 12 min se realiza la incisión; y el objetivo es el nacimiento antes de los 15 min, dado que la lesión neurológica progresa rápidamente tras este umbral.`},{id:"chronic",title:"Hipoxia Crónica (Preexistente)",content:`Estos fetos sufren una lesión hipóxico-isquémica o estrés prolongado antes del inicio del parto (ej. RCIU severo, preeclampsia). 

Su CTG de ingreso se caracteriza por una línea base rígida (taquicardia o límite superior normal), ausencia de ciclado fetal (falta de aceleraciones) y variabilidad reducida (<5 lpm). Estos fetos no tienen reserva compensatoria y no tolerarán las contracciones del trabajo de parto. Las desaceleraciones que presentan suelen ser tardías superficiales ("shallow late decelerations").`},{id:"infection",title:"Infección e Inflamación Fetal",content:`La corioamnionitis puede evolucionar al Síndrome de Respuesta Inflamatoria Sistémica Fetal, asociado a daño endotelial e hipotensión. 

La inflamación sensibiliza el cerebro fetal inmaduro, bajando el umbral en el que la hipoxia desencadena apoptosis neuronal. Un feto infectado puede sufrir daño cerebral con grados de hipoxia que un feto sano toleraría. En el CTG no hay un patrón único, pero a menudo se observa taquicardia basal prolongada con pérdida de ciclado y variabilidad reducida.`},{id:"zigzag",title:"Patrón Zig-Zag",content:`Se define como una amplitud de variabilidad de la línea base que supera los 25 lpm con una duración mínima de 1 minuto (variabilidad marcada o "saltatoria" sostenida).

Fisiopatológicamente representa una inestabilidad del sistema nervioso autónomo: una activación alternante y exagerada de las ramas simpática y parasimpática en respuesta a una hipoxia de evolución rápida y reciente. Refleja un sistema nervioso central que aún está intacto pero que está siendo desafiado de forma aguda.

Cuando es transitorio (<2 min) suele ser benigno y atribuible a movimientos fetales. Sin embargo, un zig-zag persistente debe interpretarse como un signo de alarma precoz que antecede a la pérdida de variabilidad, e indica vigilancia estrecha y búsqueda de la causa.`},{id:"cordon",title:"Accidentes de Cordón: Prolapso y Vasa Previa",content:`Son emergencias mecánicas que comprometen de forma aguda el intercambio gaseoso o el volumen sanguíneo fetal.

PROLAPSO DE CORDÓN: el cordón desciende por delante de la presentación tras la rotura de membranas. La compresión del cordón entre la presentación y la pelvis genera una desaceleración profunda y mantenida (bradicardia) de inicio súbito. Es una hipoxia aguda: requiere elevación manual de la presentación, posición genupectoral o de Trendelenburg y cesárea de emergencia.

VASA PREVIA: los vasos fetales transcurren por las membranas sobre el orificio cervical interno, sin protección del cordón ni de la placenta. La rotura de membranas puede desgarrar estos vasos, provocando una exanguinación fetal rápida. El CTG muestra de forma característica un patrón sinusoidal (ondas suaves y regulares por anemia fetal severa) seguido de bradicardia terminal. A diferencia de las otras causas, aquí el feto pierde su propio volumen sanguíneo; el sangrado vaginal es de origen fetal. Exige cesárea inmediata.`}],Mm=[{id:"c1",level:"Introductorio",title:"Caso 1: Paciente Clara V. (39 sem)",context:"Primigesta de 39 semanas en fase activa de parto. Dilatación 5 cm. Dinámica uterina espontánea. Signos vitales maternos normales.",correctAnswers:{baseline:"Normal (110 - 160 lpm)",variability:"Normal (5 - 25 lpm)",cycling:"Presente",accels:"Presentes",decels:"Ausentes",toco:"Normal (≤ 5 en 10 min)",hypoxia:"Normal / Patrón Compensado",management:"Manejo expectante / Continuar control"},evolution:[{time:"Registro de Ingreso (30 min)",duration:30,config:{baseline:140,variability:15,accels:!0,cycling:!0,decelType:"none",contractions:[3,7,12,16,21,26]}}],feedback:{interpretacion:"Línea base 140 lpm, variabilidad normal (15 lpm), presencia de aceleraciones, sin desaceleraciones.",fisiopatologia:"PATRÓN COMPENSADO NORMAL: Sistema nervioso central (SNC) y miocardio intactos y excelentemente oxigenados. El sistema nervioso somático está activo (aceleraciones).",clinica:"Continuar atención habitual del parto. No se requiere intervención.",errores:"Confundir las aceleraciones amplias con artefactos o taquicardia temporal."}},{id:"c2",level:"Introductorio",title:"Caso 2: Paciente Sofía M. (40 sem)",context:"Secundigesta de 40 semanas. Parto inducido con oxitocina. Dilatación 7 cm. Amniorrexis espontánea hace 1 hora (líquido claro).",correctAnswers:{baseline:"Normal (110 - 160 lpm)",variability:"Normal (5 - 25 lpm)",cycling:"Presente",accels:"Presentes",decels:"Variable ndo conservar energía. Caída rápida del pH (aproximadamente 0.01 cada 2-3 minutos).",clinica:"Emergencia clínica. 1) Detener oxitocina inmediatamente. 2) Administrar tocolítico agudo (ej. Terbutalina). 3) Reanimación intrauterina.",errores:'Esperar a ver "si se recupera" sin suspender el uterotónico, lo que llevará rápidamente a acidosis metabólica profunda.'}},{id:"c4",level:"Intermedio",title:"Caso 4: Paciente Valentina C. (38 sem)",context:"Paciente de 38 semanas, RCIU leve detectado en tercer trimestre. Inicio de trabajo de parto espontáneo.",correctAnswers:{baseline:"Taquicardia (> 160 lpm)",variability:"Ausente o Mínima (≤ 5 lpm)",cycling:"Ausente",accels:"Ausentes",decels:"Tardías",toco:"Normal (≤ 5 en 10 min)",hypoxia:"Hipoxia de Evolución Lenta",management:"Extracción pronta (Evitar trabajo de parto)"},evolution:[{time:"Fase Inicial (Latente - 30 min)",duration:30,config:{baseline:140,variability:10,accels:!1,decelType:"variable",contractions:[4,11,18,25]}},{time:"Fase Activa (2 horas después - 30 min)",duration:30,config:{baseline:165,variability:5,accels:!1,decelType:"late",contractions:[2,6,9.5,13,17,21,24.5,28]}}],feedback:{interpretacion:"Evolución de un patrón estable a taquicardia (165 lpm), pérdida de aceleraciones, reducción de variabilidad y aparición de desaceleraciones tardías.",fisiopatologia:"HIPOXIA PROGRESIVA DE EVOLUCIÓN LENTA: Cascada hipóxica clásica. El aumento de la línea base es un intento del sistema simpático mediado por catecolaminas para aumentar el gasto cardíaco. La caída de variabilidad indica afectación del SNC.",clinica:"Feto agotando su reserva compensatoria. Preparar para finalización inmediata del parto (Cesárea o parto instrumentado si dilatación completa).",errores:'No comparar el trazado actual con el previo. La clave del razonamiento clínico es ver la "tendencia" evolutiva, no solo el segmento actual.'}},{id:"c5",level:"Avanzado",title:"Caso 5: Paciente Lucía G. (36 sem)",context:"Paciente de 36 semanas, preeclampsia se
