<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTG Creator — FetalPhysio Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0B1120; color: white; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    input[type=range] { accent-color: #22d3ee; }
    select option { background: #1e293b; }
    .seg-active { border-color: #22d3ee !important; background: rgba(34,211,238,0.06) !important; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

// ── Canvas constants ──────────────────────────────────────
const FHR_TOP     = 22;
const FHR_BOTTOM  = 262;
const TOCO_TOP    = 280;
const TOCO_BOTTOM = 370;
const CANVAS_H    = 388;
const PX_PER_MIN  = 60;
const AXIS_W      = 44;
const TRANSITION_MIN = 0.4; // 24 seconds smooth transition between segments

// ── Maths ─────────────────────────────────────────────────
const hash       = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return (s - Math.floor(s)) - 0.5; };
const smoothstep = (a, b, t) => { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const clamp      = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const gaussian   = (x, c, w, a) => a * Math.exp(-0.5 * ((x - c) / w) ** 2);
const lerp       = (a, b, t) => a + (b - a) * t;

const fhrToPx  = fhr => FHR_TOP  + (210 - fhr)  / 160 * (FHR_BOTTOM - FHR_TOP);
const tocoToPx = p   => TOCO_BOTTOM - (p / 100) * (TOCO_BOTTOM - TOCO_TOP);

// Variability amplitude → clinical label
const varLabel = amp => {
  if (amp < 2)  return 'Ausente';
  if (amp < 6)  return 'Mínima';
  if (amp <= 25) return 'Normal';
  return 'Marcada';
};
const varColor = amp => {
  if (amp < 2)  return '#ef4444';
  if (amp < 6)  return '#f59e0b';
  if (amp <= 25) return '#22d3ee';
  return '#a78bfa';
};

// ── Segment interpolation ─────────────────────────────────
// segments = [{time, baseline, varAmp}, ...] sorted by time, first at t=0
function getSegmentValues(segments, t) {
  let idx = 0;
  for (let i = 0; i < segments.length; i++) {
    if (segments[i].time <= t) idx = i;
    else break;
  }
  const cur  = segments[idx];
  const next = segments[idx + 1];

  if (!next) return { baseline: cur.baseline, varAmp: cur.varAmp };

  // Smooth transition approaching next segment
  const transStart = next.time - TRANSITION_MIN;
  if (t >= transStart) {
    const p = smoothstep(0, 1, (t - transStart) / TRANSITION_MIN);
    return {
      baseline: lerp(cur.baseline, next.baseline, p),
      varAmp:   lerp(cur.varAmp,   next.varAmp,   p)
    };
  }
  return { baseline: cur.baseline, varAmp: cur.varAmp };
}

// ── Variability waveform ──────────────────────────────────
const variabilityAt = (x, amp) => {
  const slow = Math.sin(x / 17) + 0.6 * Math.sin(x / 6.3) + 0.4 * Math.sin(x / 2.7);
  const beat = hash(x) * 1.2;
  return ((slow / 2.0) + beat * 0.5) * (amp / 2);
};
const cyclingFactor = min => 0.35 + 0.65 * (0.5 + 0.5 * Math.sin((min / 4) * Math.PI));

// ── Deceleration drop ─────────────────────────────────────
function decelDropAt(t, x, decels) {
  let drop = 0;
  decels.forEach((d, i) => {
    const seed   = i * 47.3;
    const depth  = d.depth   ?? 30;
    const durMin = (d.duration ?? 45) / 60;
    const startT = d.time ?? 1;
    const endT   = startT + durMin;
    const type   = d.type ?? 'variable';

    if (type === 'variable') {
      const ramp    = 5 / 60;
      const nadirEnd = endT - ramp;
      if (t >= startT && t < startT + ramp) {
        drop = Math.max(drop, smoothstep(0, 1, (t - startT) / ramp) * depth);
      } else if (t >= startT + ramp && t < nadirEnd) {
        drop = Math.max(drop, depth + hash(x * 0.4 + seed) * depth * 0.07);
      } else if (t >= nadirEnd && t < endT) {
        drop = Math.max(drop, smoothstep(0, 1, (endT - t) / ramp) * depth);
      }

    } else if (type === 'late') {
      const lag = 30 / 60;
      const s = startT + lag, e_ = endT + lag, mid = s + (e_ - s) / 2;
      if (t >= s && t < mid)  drop = Math.max(drop, smoothstep(0,1,(t-s)/(mid-s)) * depth);
      else if (t >= mid && t <= e_) drop = Math.max(drop, smoothstep(0,1,(e_-t)/(e_-mid)) * depth);

    } else if (type === 'early') {
      if (t >= startT && t <= endT)
        drop = Math.max(drop, Math.sin(((t - startT) / durMin) * Math.PI) * depth);

    } else if (type === 'prolonged') {
      const ramp = 0.25;
      if (t >= startT && t < startT + ramp)
        drop = Math.max(drop, smoothstep(0,1,(t-startT)/ramp) * depth);
      else if (t >= startT + ramp && t < endT - ramp)
        drop = Math.max(drop, depth + hash(x * 0.2 + seed) * depth * 0.05);
      else if (t >= endT - ramp && t <= endT)
        drop = Math.max(drop, smoothstep(0,1,(endT-t)/ramp) * depth);
    }
  });
  return drop;
}

// ── Main draw ─────────────────────────────────────────────
function drawCTG(canvas, config) {
  const {
    segments = [{ time: 0, baseline: 140, varAmp: 8 }],
    cycling  = true,
    accels   = false,
    duration = 20,
    decels   = [],
    contractions = [],
    activeSegTime = null
  } = config;

  const W = Math.round(duration * PX_PER_MIN);
  canvas.width  = W;
  canvas.height = CANVAS_H;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#050816';
  ctx.fillRect(0, 0, W, CANVAS_H);

  // ── Grid ─────────────────────────────────────────────
  [60, 90, 120, 150, 180, 210].forEach(fhr => {
    const y = fhrToPx(fhr);
    ctx.strokeStyle = fhr === 150 ? 'rgba(100,116,139,0.4)' : 'rgba(71,85,105,0.22)';
    ctx.lineWidth   = fhr === 150 ? 1.5 : 0.8;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  });
  for (let m = 0; m <= duration; m++) {
    const x = m * PX_PER_MIN;
    ctx.strokeStyle = m % 5 === 0 ? 'rgba(100,116,139,0.28)' : 'rgba(71,85,105,0.14)';
    ctx.lineWidth   = m % 5 === 0 ? 0.8 : 0.5;
    ctx.beginPath(); ctx.moveTo(x, FHR_TOP); ctx.lineTo(x, FHR_BOTTOM + 10); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(100,116,139,0.3)'; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(0, TOCO_TOP - 6); ctx.lineTo(W, TOCO_TOP - 6); ctx.stroke();
  ctx.setLineDash([]);
  [25, 50, 75].forEach(p => {
    ctx.strokeStyle = 'rgba(71,85,105,0.18)'; ctx.lineWidth = 0.5;
    const y = tocoToPx(p);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  });

  // Time labels
  ctx.fillStyle = 'rgba(100,116,139,0.65)'; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
  for (let m = 5; m <= duration; m += 5) ctx.fillText(m + "'", m * PX_PER_MIN, CANVAS_H - 3);

  // Repeat axis labels every 10 min
  ctx.font = '8.5px system-ui'; ctx.textAlign = 'right';
  for (let m = 10; m <= duration; m += 10) {
    [210, 180, 150, 120, 90, 60].forEach(fhr => {
      const y = fhrToPx(fhr);
      ctx.fillStyle = 'rgba(30,41,59,0.85)';
      ctx.fillRect(m * PX_PER_MIN - 28, y - 7, 26, 13);
      ctx.fillStyle = 'rgba(100,116,139,0.6)';
      ctx.fillText(fhr, m * PX_PER_MIN - 4, y + 4);
    });
  }

  // ── Segment breakpoint markers ────────────────────────
  segments.slice(1).forEach(seg => {
    const x = seg.time * PX_PER_MIN;
    const isActive = seg.time === activeSegTime;
    ctx.strokeStyle = isActive ? 'rgba(34,211,238,0.7)' : 'rgba(34,211,238,0.25)';
    ctx.lineWidth   = isActive ? 1.5 : 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x, FHR_TOP - 5); ctx.lineTo(x, FHR_BOTTOM + 15); ctx.stroke();
    ctx.setLineDash([]);
    // Triangle marker
    ctx.fillStyle = isActive ? 'rgba(34,211,238,0.9)' : 'rgba(34,211,238,0.35)';
    ctx.beginPath(); ctx.moveTo(x-5, FHR_TOP-5); ctx.lineTo(x+5, FHR_TOP-5); ctx.lineTo(x, FHR_TOP+5); ctx.closePath(); ctx.fill();
    // Time label
    ctx.fillStyle = isActive ? '#22d3ee' : 'rgba(34,211,238,0.5)';
    ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(seg.time.toFixed(1) + "'", x + 4, FHR_TOP + 3);
  });

  // ── TOCO ─────────────────────────────────────────────
  const tocoPath = [];
  for (let x = 0; x < W; x++) {
    const t = x / PX_PER_MIN;
    let toco = 2 + hash(x * 0.05) * 1.5;
    contractions.forEach(c => toco += gaussian(t, c.time, (c.duration ?? 0.7) * 0.48, c.amplitude ?? 85));
    tocoPath.push(clamp(toco, 0, 100));
  }
  ctx.strokeStyle = 'rgba(251,191,36,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  tocoPath.forEach((v, x) => { const y = tocoToPx(v); x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle = 'rgba(251,191,36,0.06)';
  ctx.beginPath();
  tocoPath.forEach((v, x) => { const y = tocoToPx(v); x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); });
  ctx.lineTo(W, TOCO_BOTTOM); ctx.lineTo(0, TOCO_BOTTOM); ctx.closePath(); ctx.fill();

  // ── FHR ──────────────────────────────────────────────
  ctx.strokeStyle = '#6EE7FF'; ctx.lineWidth = 1.8;
  ctx.shadowColor = 'rgba(110,231,255,0.35)'; ctx.shadowBlur = 3;
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const t    = x / PX_PER_MIN;
    const sv   = getSegmentValues(segments, t);
    const cf   = cycling ? cyclingFactor(t) : 1;
    const v    = variabilityAt(x * 0.5, sv.varAmp * cf);
    const drop = decelDropAt(t, x, decels);

    let fhr = drop > 15
      ? sv.baseline - drop + hash(x * 0.9) * (sv.varAmp * 0.15)
      : sv.baseline + v - drop;

    if (accels && drop < 5) {
      const trig = Math.sin(x / 23) + 0.7 * Math.sin(x / 11.3);
      if (trig > 1.4) fhr += (10 + hash(x * 0.07) * 5) * Math.max(0, Math.sin(Math.PI * ((trig - 1.4) / 0.6)));
    }
    const y = fhrToPx(clamp(fhr, 50, 210));
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ── UI Components ─────────────────────────────────────────
const SectionTitle = ({ children, color }) =>
  e('p', {
    style: {
      fontSize: 9, fontWeight: 700, textTransform: 'uppercase',
      letterSpacing: 2, color: color ?? '#475569',
      marginBottom: 10, marginTop: 16,
      paddingBottom: 6, borderBottom: '1px solid rgba(30,41,59,1)'
    }
  }, children);

const Slider = ({ label, value, min, max, step = 1, unit = '', onChange, color = '#22d3ee', note }) =>
  e('div', { style: { marginBottom: 12 } },
    e('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 4 } },
      e('label', { style: { fontSize: 11, color: '#94a3b8' } }, label),
      e('div', { style: { textAlign: 'right' } },
        e('span', { style: { fontSize: 12, fontWeight: 700, color } }, value + (unit ? ' ' + unit : '')),
        note && e('span', { style: { fontSize: 10, color, marginLeft: 6, opacity: 0.7 } }, '· ' + note)
      )
    ),
    e('input', {
      type: 'range', min, max, step, value,
      onChange: ev => onChange(Number(ev.target.value)),
      style: { width: '100%', accentColor: color, cursor: 'pointer' }
    })
  );

const Toggle = ({ label, value, onChange }) =>
  e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 } },
    e('span', { style: { fontSize: 11, color: '#94a3b8' } }, label),
    e('button', {
      onClick: () => onChange(!value),
      style: {
        width: 36, height: 20, borderRadius: 10, border: 'none', cursor: 'pointer',
        background: value ? '#0891b2' : '#334155',
        position: 'relative', transition: 'background 0.2s', flexShrink: 0
      }
    },
      e('span', {
        style: {
          position: 'absolute', top: 3, width: 14, height: 14,
          borderRadius: '50%', background: 'white',
          left: value ? 19 : 3, transition: 'left 0.2s'
        }
      })
    )
  );

const NumberInput = ({ label, value, min, max, step, onChange }) =>
  e('div', null,
    e('label', { style: { fontSize: 10, color: '#64748b', display: 'block', marginBottom: 4 } }, label),
    e('input', {
      type: 'number', min, max, step, value,
      onChange: ev => onChange(Number(ev.target.value)),
      style: {
        width: '100%', background: '#0f172a', border: '1px solid #1e293b',
        color: 'white', fontSize: 11, borderRadius: 6, padding: '6px 8px',
        outline: 'none'
      }
    })
  );

const Btn = ({ children, onClick, color = '#0891b2', border, textColor = 'white', small }) =>
  e('button', {
    onClick,
    style: {
      padding: small ? '6px 10px' : '9px 12px',
      borderRadius: 7, border: border ? `1px solid ${border}` : 'none',
      background: border ? 'transparent' : color,
      color: border ? border : textColor,
      fontSize: small ? 10 : 11, fontWeight: 600, cursor: 'pointer',
      transition: 'opacity 0.15s', width: '100%', marginBottom: 6
    },
    onMouseOver: ev => ev.target.style.opacity = '0.8',
    onMouseOut:  ev => ev.target.style.opacity = '1'
  }, children);

// Decel card
const DecelCard = ({ decel, index, onChange, onRemove }) =>
  e('div', {
    style: {
      background: 'rgba(15,23,42,0.7)', border: '1px solid #1e293b',
      borderRadius: 8, padding: 10, marginBottom: 8
    }
  },
    e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
      e('span', { style: { fontSize: 11, fontWeight: 600, color: '#22d3ee' } }, `Desacel. #${index + 1}`),
      e('button', { onClick: onRemove, style: { background: 'none', border: 'none', color: '#475569', cursor: 'pointer', fontSize: 16 } }, '×')
    ),
    e('div', { style: { marginBottom: 8 } },
      e('label', { style: { fontSize: 10, color: '#64748b', display: 'block', marginBottom: 4 } }, 'Tipo'),
      e('select', {
        value: decel.type,
        onChange: ev => onChange({ ...decel, type: ev.target.value }),
        style: {
          width: '100%', background: '#0f172a', border: '1px solid #1e293b',
          color: 'white', fontSize: 11, borderRadius: 6, padding: '6px 8px', outline: 'none'
        }
      },
        e('option', { value: 'variable'  }, 'Variable (barorreceptora)'),
        e('option', { value: 'late'      }, 'Tardía (quimiorreceptora)'),
        e('option', { value: 'early'     }, 'Precoz (espejo)'),
        e('option', { value: 'prolonged' }, 'Prolongada (> 2 min)'),
      )
    ),
    e('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6 } },
      e(NumberInput, { label: 'Inicio (min)',   value: decel.time,     min: 0.5, max: 60,  step: 0.5, onChange: v => onChange({ ...decel, time: v }) }),
      e(NumberInput, { label: 'Profund. (lpm)', value: decel.depth,    min: 10,  max: 90,  step: 5,   onChange: v => onChange({ ...decel, depth: v }) }),
      e(NumberInput, { label: 'Duración (seg)', value: decel.duration, min: 15,  max: 300, step: 5,   onChange: v => onChange({ ...decel, duration: v }) })
    )
  );

// Contraction card
const ContractionCard = ({ c, index, onChange, onRemove }) =>
  e('div', {
    style: {
      background: 'rgba(15,23,42,0.7)', border: '1px solid #1e293b',
      borderRadius: 8, padding: 10, marginBottom: 8
    }
  },
    e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
      e('span', { style: { fontSize: 11, fontWeight: 600, color: '#f59e0b' } }, `Contracción #${index + 1}`),
      e('button', { onClick: onRemove, style: { background: 'none', border: 'none', color: '#475569', cursor: 'pointer', fontSize: 16 } }, '×')
    ),
    e('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6 } },
      e(NumberInput, { label: 'Inicio (min)',   value: c.time,               min: 0.5, max: 60,  step: 0.5, onChange: v => onChange({ ...c, time: v }) }),
      e(NumberInput, { label: 'Duración (min)', value: c.duration,           min: 0.3, max: 2.5, step: 0.1, onChange: v => onChange({ ...c, duration: v }) }),
      e(NumberInput, { label: 'Amplitud (UA)',  value: c.amplitude ?? 85,    min: 20,  max: 100, step: 5,   onChange: v => onChange({ ...c, amplitude: v }) })
    )
  );

// Y-axis
const YAxis = () =>
  e('div', {
    style: {
      position: 'absolute', left: 0, top: 0, width: AXIS_W, height: CANVAS_H,
      pointerEvents: 'none', zIndex: 10,
      background: 'linear-gradient(to right, #050816 65%, transparent)'
    }
  },
    [210, 180, 150, 120, 90, 60].map(fhr =>
      e('div', {
        key: fhr,
        style: {
          position: 'absolute', top: fhrToPx(fhr) - 7,
          left: 0, width: AXIS_W - 4, textAlign: 'right',
          fontSize: 9, color: 'rgba(148,163,184,0.75)', fontFamily: 'system-ui'
        }
      }, fhr)
    ),
    e('div', {
      style: {
        position: 'absolute', top: TOCO_TOP + 4,
        left: 0, width: AXIS_W - 4, textAlign: 'right',
        fontSize: 8, color: 'rgba(251,191,36,0.5)', fontWeight: 'bold'
      }
    }, 'UA')
  );

// ── App ───────────────────────────────────────────────────
function App() {
  // Segments: each has { id, time, baseline, varAmp }
  const [segments,     setSegments]     = useState([{ id: 0, time: 0, baseline: 140, varAmp: 8 }]);
  const [activeSegId,  setActiveSegId]  = useState(0);
  const [cycling,      setCycling]      = useState(true);
  const [accels,       setAccels]       = useState(false);
  const [duration,     setDuration]     = useState(20);
  const [decels,       setDecels]       = useState([]);
  const [contractions, setContractions] = useState([]);
  const [sidebarTab,   setSidebarTab]   = useState('trazado'); // 'trazado' | 'decels' | 'contracciones'

  const canvasRef    = useRef(null);
  const wrapperRef   = useRef(null);
  const nextId       = useRef(1);

  const activeSeg    = segments.find(s => s.id === activeSegId) ?? segments[0];
  const activeSegTime = activeSeg?.time ?? 0;

  // ── Draw on any change ───────────────────────────────
  useEffect(() => {
    if (!canvasRef.current) return;
    drawCTG(canvasRef.current, {
      segments, cycling, accels, duration, decels, contractions, activeSegTime
    });
  }, [segments, cycling, accels, duration, decels, contractions, activeSegId]);

  // ── Update active segment field ───────────────────────
  const updateSeg = (field, value) => {
    setSegments(prev => prev.map(s => s.id === activeSegId ? { ...s, [field]: value } : s));
  };

  // ── Canvas click → create breakpoint ─────────────────
  const handleCanvasClick = useCallback(ev => {
    const rect = canvasRef.current.getBoundingClientRect();
    const px   = ev.clientX - rect.left;
    const t    = parseFloat((px / PX_PER_MIN).toFixed(1));
    if (t < 0.1 || t > duration - 0.1) return;

    // Don't add a segment too close to an existing one
    const tooClose = segments.some(s => Math.abs(s.time - t) < 0.3);
    if (tooClose) {
      // Just select the nearest segment
      const nearest = segments.reduce((a, b) => Math.abs(a.time - t) < Math.abs(b.time - t) ? a : b);
      setActiveSegId(nearest.id);
      return;
    }

    // Inherit values from current segment at that time
    const inherited = getSegmentValues(segments, t);
    const newSeg = {
      id:       nextId.current++,
      time:     t,
      baseline: Math.round(inherited.baseline),
      varAmp:   Math.round(inherited.varAmp * 10) / 10
    };
    setSegments(prev => [...prev, newSeg].sort((a, b) => a.time - b.time));
    setActiveSegId(newSeg.id);
    setSidebarTab('trazado');
  }, [segments, duration]);

  const removeSeg = id => {
    if (id === 0) return; // can't remove first segment
    setSegments(prev => prev.filter(s => s.id !== id));
    setActiveSegId(0);
  };

  const addDecel = () => setDecels(d => [...d, {
    type: 'variable', time: parseFloat((duration * 0.3).toFixed(1)), depth: 35, duration: 45
  }]);
  const addContraction = () => setContractions(c => [...c, {
    time: parseFloat((duration * 0.3).toFixed(1)), duration: 0.8, amplitude: 80
  }]);

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({
      fetalphysio_config: { segments, cycling, accels, duration, decels, contractions }
    }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'trazado-ctg.json'; a.click();
  };
  const exportPNG = () => {
    if (!canvasRef.current) return;
    const a = document.createElement('a');
    a.href = canvasRef.current.toDataURL('image/png'); a.download = 'trazado-ctg.png'; a.click();
  };

  // ── Render ────────────────────────────────────────────
  return e('div', { style: { display: 'flex', height: '100vh', overflow: 'hidden', background: '#0B1120' } },

    // ══ SIDEBAR ═══════════════════════════════════════
    e('div', {
      style: {
        width: 272, flexShrink: 0, display: 'flex', flexDirection: 'column',
        borderRight: '1px solid #1e293b', background: '#0D1321', overflowY: 'auto'
      }
    },

      // Header
      e('div', { style: { padding: '14px 16px 10px', borderBottom: '1px solid #1e293b' } },
        e('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 } },
          e('div', { style: { width: 7, height: 7, borderRadius: '50%', background: '#22d3ee', boxShadow: '0 0 8px rgba(34,211,238,0.7)' } }),
          e('span', { style: { fontSize: 13, fontWeight: 700, color: 'white' } },
            'CTG ', e('span', { style: { color: '#22d3ee' } }, 'Creator'))
        ),
        e('p', { style: { fontSize: 10, color: '#475569', margin: 0 } }, 'Haz clic en el trazado para agregar un punto de quiebre')
      ),

      // Tabs
      e('div', { style: { display: 'flex', borderBottom: '1px solid #1e293b' } },
        [
          { key: 'trazado', label: 'Trazado' },
          { key: 'decels',  label: `Desacel. (${decels.length})` },
          { key: 'contracciones', label: `Contrac. (${contractions.length})` }
        ].map(tab =>
          e('button', {
            key: tab.key,
            onClick: () => setSidebarTab(tab.key),
            style: {
              flex: 1, padding: '8px 4px', fontSize: 10, fontWeight: 600,
              border: 'none', cursor: 'pointer', borderBottom: '2px solid',
              borderBottomColor: sidebarTab === tab.key ? '#22d3ee' : 'transparent',
              background: 'transparent',
              color: sidebarTab === tab.key ? '#22d3ee' : '#475569',
              transition: 'all 0.15s'
            }
          }, tab.label)
        )
      ),

      // ── Tab: Trazado ────────────────────────────────
      sidebarTab === 'trazado' && e('div', { style: { flex: 1, padding: '12px 14px' } },

        e(SectionTitle, { color: '#475569' }, 'Duración del trazado'),
        e(Slider, {
          label: 'Duración', value: duration, min: 5, max: 40, unit: 'min', onChange: setDuration
        }),
        e(Toggle, { label: 'Cycling fetal',  value: cycling, onChange: setCycling }),
        e(Toggle, { label: 'Aceleraciones',  value: accels,  onChange: setAccels }),

        // Segments list
        e(SectionTitle, { color: '#22d3ee' }, `Puntos de quiebre (${segments.length})`),
        e('p', { style: { fontSize: 10, color: '#334155', marginBottom: 8, marginTop: -6 } },
          'Haz clic en el trazado para agregar'),

        ...segments.map(seg =>
          e('div', {
            key: seg.id,
            onClick: () => setActiveSegId(seg.id),
            style: {
              padding: '8px 10px', borderRadius: 8, marginBottom: 6, cursor: 'pointer',
              border: `1px solid ${seg.id === activeSegId ? '#22d3ee' : '#1e293b'}`,
              background: seg.id === activeSegId ? 'rgba(34,211,238,0.06)' : 'rgba(15,23,42,0.5)',
              transition: 'all 0.15s'
            }
          },
            e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
              e('span', { style: { fontSize: 11, fontWeight: 600, color: seg.id === activeSegId ? '#22d3ee' : '#94a3b8' } },
                seg.time === 0 ? 'Inicio (min 0)' : `Desde min ${seg.time.toFixed(1)}`),
              seg.id !== 0 && e('button', {
                onClick: ev => { ev.stopPropagation(); removeSeg(seg.id); },
                style: { background: 'none', border: 'none', color: '#475569', cursor: 'pointer', fontSize: 14, padding: '0 2px' }
              }, '×')
            ),
            e('div', { style: { display: 'flex', gap: 10, marginTop: 3 } },
              e('span', { style: { fontSize: 10, color: '#6EE7FF' } }, `FCF ${seg.baseline} lpm`),
              e('span', { style: { fontSize: 10, color: varColor(seg.varAmp) } },
                `Var. ${seg.varAmp} lpm · ${varLabel(seg.varAmp)}`)
            )
          )
        ),

        // Active segment controls
        activeSeg && e('div', {
          style: {
            marginTop: 14, padding: '12px 12px 8px',
            background: 'rgba(34,211,238,0.04)',
            border: '1px solid rgba(34,211,238,0.15)', borderRadius: 10
          }
        },
          e('p', { style: { fontSize: 10, fontWeight: 700, color: '#22d3ee', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 } },
            activeSeg.time === 0 ? 'Editando: inicio' : `Editando: desde min ${activeSeg.time.toFixed(1)}`),

          e(Slider, {
            label: 'FCF Basal', value: activeSeg.baseline,
            min: 60, max: 210, step: 1, unit: 'lpm',
            color: '#6EE7FF',
            onChange: v => updateSeg('baseline', v)
          }),

          e(Slider, {
            label: 'Variabilidad', value: activeSeg.varAmp,
            min: 0, max: 30, step: 0.5, unit: 'lpm',
            color: varColor(activeSeg.varAmp),
            note: varLabel(activeSeg.varAmp),
            onChange: v => updateSeg('varAmp', v)
          })
        )
      ),

      // ── Tab: Desaceleraciones ───────────────────────
      sidebarTab === 'decels' && e('div', { style: { flex: 1, padding: '12px 14px' } },
        ...decels.map((d, i) =>
          e(DecelCard, {
            key: i, decel: d, index: i,
            onChange: v => setDecels(prev => prev.map((x, j) => j === i ? v : x)),
            onRemove: () => setDecels(prev => prev.filter((_, j) => j !== i))
          })
        ),
        e('button', {
          onClick: addDecel,
          style: {
            width: '100%', padding: 8, borderRadius: 8,
            border: '1px dashed rgba(71,85,105,0.6)', background: 'transparent',
            color: '#64748b', fontSize: 11, cursor: 'pointer', marginTop: 4
          },
          onMouseOver: ev => { ev.target.style.borderColor='#22d3ee'; ev.target.style.color='#22d3ee'; },
          onMouseOut:  ev => { ev.target.style.borderColor='rgba(71,85,105,0.6)'; ev.target.style.color='#64748b'; }
        }, '+ Agregar desaceleración')
      ),

      // ── Tab: Contracciones ──────────────────────────
      sidebarTab === 'contracciones' && e('div', { style: { flex: 1, padding: '12px 14px' } },
        ...contractions.map((c, i) =>
          e(ContractionCard, {
            key: i, c, index: i,
            onChange: v => setContractions(prev => prev.map((x, j) => j === i ? v : x)),
            onRemove: () => setContractions(prev => prev.filter((_, j) => j !== i))
          })
        ),
        e('button', {
          onClick: addContraction,
          style: {
            width: '100%', padding: 8, borderRadius: 8,
            border: '1px dashed rgba(71,85,105,0.6)', background: 'transparent',
            color: '#64748b', fontSize: 11, cursor: 'pointer', marginTop: 4
          },
          onMouseOver: ev => { ev.target.style.borderColor='#f59e0b'; ev.target.style.color='#f59e0b'; },
          onMouseOut:  ev => { ev.target.style.borderColor='rgba(71,85,105,0.6)'; ev.target.style.color='#64748b'; }
        }, '+ Agregar contracción')
      ),

      // Export
      e('div', { style: { padding: '10px 14px', borderTop: '1px solid #1e293b', flexShrink: 0 } },
        e(Btn, { onClick: exportJSON }, '↓  Exportar JSON'),
        e(Btn, { onClick: exportPNG, border: '#475569', textColor: '#94a3b8' }, '↓  Exportar PNG')
      )
    ),

    // ══ CANVAS AREA ═══════════════════════════════════
    e('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' } },

      // Top bar
      e('div', {
        style: {
          padding: '9px 18px', borderBottom: '1px solid #1e293b', background: '#0D1321',
          display: 'flex', alignItems: 'center', gap: 16, flexShrink: 0
        }
      },
        e('span', { style: { fontSize: 10, color: '#334155', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1 } }, 'Vista previa'),
        e('span', { style: { fontSize: 11, color: '#6EE7FF', fontWeight: 600 } }, `FCF ${activeSeg?.baseline ?? 140} lpm`),
        e('span', { style: { fontSize: 11, color: varColor(activeSeg?.varAmp ?? 8), fontWeight: 600 } },
          `Var. ${varLabel(activeSeg?.varAmp ?? 8)}`),
        segments.length > 1 && e('span', { style: { fontSize: 10, color: '#22d3ee', opacity: 0.7 } },
          `${segments.length} segmentos`),
        decels.length > 0 && e('span', { style: { fontSize: 10, color: '#a78bfa' } }, `${decels.length} desacel.`),
        contractions.length > 0 && e('span', { style: { fontSize: 10, color: '#f59e0b' } }, `${contractions.length} contrac.`),
        e('span', { style: { fontSize: 10, color: '#1e293b', marginLeft: 'auto' } }, `${duration} min`),

        // Hint
        e('span', {
          style: {
            fontSize: 10, color: '#22d3ee', opacity: 0.5,
            padding: '3px 8px', borderRadius: 20,
            border: '1px solid rgba(34,211,238,0.15)', marginLeft: 8
          }
        }, '← clic en el trazado para agregar punto de quiebre')
      ),

      // Canvas scroll
      e('div', {
        style: { flex: 1, overflow: 'auto', padding: '18px 14px 14px' }
      },
        e('div', {
          ref: wrapperRef,
          style: { position: 'relative', display: 'inline-block', minWidth: '100%', cursor: 'crosshair' },
          onClick: handleCanvasClick
        },
          e(YAxis),
          e('canvas', {
            ref: canvasRef,
            style: {
              display: 'block', marginLeft: AXIS_W,
              borderRadius: 10,
              border: '1px solid rgba(110,231,255,0.07)',
              boxShadow: '0 8px 40px rgba(0,0,0,0.6)'
            }
          })
        )
      ),

      // Bottom bar
      e('div', {
        style: {
          padding: '5px 18px', borderTop: '1px solid rgba(30,41,59,0.5)',
          display: 'flex', alignItems: 'center', gap: 20
        }
      },
        e('span', { style: { fontSize: 9, color: '#1e293b' } }, '■ FCF cian  ·  ■ TOCO ámbar  ·  Escala 1 cm/min  ·  Clic = punto de quiebre  ·  ▲ = marcador de segmento'),
        e('span', { style: { fontSize: 9, color: '#1e293b', marginLeft: 'auto' } }, 'CTG Creator — FetalPhysio Tools')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
